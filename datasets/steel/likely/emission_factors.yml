# emission factors are in gCO2e/MJ
# values are for combustion and lifecycle where applicable

emission_factors:
  Electricity: 38.50
  #FLF: 94.12
  #RLF: 23.58
  Gas: 72.73
  Biomethane: 5.55
  Green hydrogen: 21.47
  Blue hydrogen: 89.88
  Wood: 9.82  # biogenic-neutral, see Charcoal note above
  Coal: 111.95
  # Charcoal and Wood are BIOGENIC-NEUTRAL factors: the CO2 released on
  # combustion is treated as balanced by regrowth (sustainably sourced planted
  # biomass) and is NOT counted. What remains covers carbonisation losses, kiln
  # methane and transport. This is a convention, not a measurement, and it is
  # load-bearing: charcoal supplies ~15.5 GJ/t crude in the BF-BOF charcoal
  # route, so this factor essentially sets that route's result.
  #   biogenic-neutral (here)        -> 0.283 tCO2e/t crude
  #   carbon counted as if fossil    -> 1.395 tCO2e/t crude  (103.9 gCO2e/MJ,
  #     stoichiometric for ~85% C at ~30 MJ/kg; an upper bound representing
  #     non-renewable sourcing, and itself a strong assumption in the opposite
  #     direction since it ignores the regrowth sink entirely)
  # Coke-based BF-BOF is 2.242 tCO2e/t crude for comparison: the charcoal
  # advantage holds under either bound, at 87% or 38% respectively.
  Charcoal: 20.43
  Coke: 107.51
  Coke Process Gas: 44.40 # these are not used for now
  BF Process Gas: 260.00 # these are not used for now
  BOF Process Gas: 182.00

  # Process gas values from IPCCC hapter 2: Stationary Combustion
  # 2006 IPCC Guidelines for National Greenhouse Gas Inventories
  # https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf
