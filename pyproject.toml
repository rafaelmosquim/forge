[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.0.0"
description = "Forge core model and scenario tools"
authors = [{name = "Forge Developers", email = "dev@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "pandas==2.2.3",
  "numpy>=1.26,<2.3",
  "PyYAML>=6.0.1,<7",
  "tqdm>=4.66,<5",
  "matplotlib>=3.9,<3.11",
  "seaborn>=0.13,<0.14",
  "plotly==5.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
